{{define "field_radio"}}{{$f := .}}<fieldset{{if .Errors}} aria-describedby="{{.Name}}-errors"{{end}}>{{with .Label}}<legend class="form-label h6">{{.}}{{if $f.Required}} <span class="text-danger">*</span>{{end}}</legend>{{end}}{{range .Options}}<div class="form-check"><input type="radio" name="{{$f.Name}}" id="{{$f.Name}}-{{.Value}}" value="{{.Value}}" class="form-check-input"{{if $f.IsSelected .Value}} checked{{end}}{{if $f.Required}} required{{end}}> <label class="form-check-label" for="{{$f.Name}}-{{.Value}}">{{.Label}}</label></div>{{end}}</fieldset>{{end}}
