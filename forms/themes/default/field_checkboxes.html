{{define "field_checkboxes"}}{{$f := .}}<fieldset{{if .Errors}} aria-describedby="{{.Name}}-errors"{{end}}>{{with .Label}}<legend>{{.}}</legend>{{end}}{{range .Options}}<label><input type="checkbox" name="{{$f.Name}}" id="{{$f.Name}}-{{.Value}}" value="{{.Value}}"{{if $f.IsSelected .Value}} checked{{end}}> {{.Label}}</label>{{end}}</fieldset>{{end}}
