{{define "field_radio"}}{{$f := .}}<fieldset{{if .Errors}} aria-describedby="{{.Name}}-errors"{{end}}>{{with .Label}}<legend>{{.}}{{if $f.Required}} *{{end}}</legend>{{end}}{{range .Options}}<label><input type="radio" name="{{$f.Name}}" id="{{$f.Name}}-{{.Value}}" value="{{.Value}}"{{if $f.IsSelected .Value}} checked{{end}}{{if $f.Required}} required{{end}}> {{.Label}}</label>{{end}}</fieldset>{{end}}
