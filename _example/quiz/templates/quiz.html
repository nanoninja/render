<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Go Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5" style="max-width: 640px;">
        <h1 class="mb-4">Go Quiz</h1>

        {{ if .Submitted }}
        <div class="alert {{ if ge .Score 4 }}alert-success{{ else if ge .Score 2 }}alert-warning{{ else }}alert-danger{{ end }} mb-4">
            <strong>Score: {{ .Score }} / {{ .Total }}</strong> —
            {{ if ge .Score 4 }}Excellent, you know your Go!
            {{ else if ge .Score 2 }}Not bad, a bit more practice!
            {{ else }}Room to improve, keep practicing!
            {{ end }}
        </div>
        {{ end }}

        {{ form .Form }}
    </div>
</body>

</html>
